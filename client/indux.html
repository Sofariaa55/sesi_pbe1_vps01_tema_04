<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Equipamento - Consumo de Energia</title>
</head>
<body>
    <h1>Cadastro de Equipamentos Energia</h1>

    <form action="http://localhost:3000/equipamentos" method="POST">
        <input type="text" name="local" placeholder="Local" value="Laboratório 03" required>
        <input type="text" name="equipamento" placeholder="Equipamento" value="Ar-condicionado" required>
        <input type="number" step="0.1" name="consumo_kwh" placeholder="Consumo kWh" value="185.4" required>
        <input type="month" name="mes_referencia" value="2026-09" required>
        <button type="submit">Enviar</button>
    </form>

    <h2>by Sofia Faria</h2>
    </script>
</html>
